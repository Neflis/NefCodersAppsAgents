[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-lab"
version = "0.1.0"
description = "Local async multi-agent lab prepared for Ollama integration."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "NefLab3D" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
